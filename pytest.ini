[pytest]
minversion = 9.0
testpaths = tests
python_files = test_*.py
python_functions = test_*
cache_dir = .pytest-runtime/cache
addopts =
    -ra
    --strict-markers
    --tb=short
    --basetemp=.pytest-runtime/tmp
markers =
    requirement(id): traces a test to a requirement identifier such as FR-001
    gui: requires a usable Tkinter desktop session
    windows: requires Windows-specific runtime behavior
